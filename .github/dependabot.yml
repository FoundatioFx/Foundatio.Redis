version: 2
registries:
  foundatio-feed:
    type: nuget-feed
    url: https://f.feedz.io/foundatio/foundatio/nuget/index.json
updates:

- package-ecosystem: nuget
  directory: "/"
  registries:
  - foundatio-feed
  schedule:
    interval: weekly
  cooldown:
    default-days: 7

- package-ecosystem: "docker-compose"
  directory: "/"
  schedule:
    interval: quarterly
